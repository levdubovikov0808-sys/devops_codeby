---
- name: Include OS-specific variables
  include_vars: "{{ ansible_os_family }}.yml"

- name: Install Apache package
  package:
    name: "{{ apache_package }}"
    state: present

- name: Install PHP packages
  package:
    name: "{{ item }}"
    state: present
  loop: "{{ php_packages }}"

- name: Install PHP MySQL extension
  package:
    name: "{{ php_mysql_package }}"
    state: present

- name: Start and enable Apache service
  service:
    name: "{{ apache_service }}"
    state: started
    enabled: yes

- name: Download WordPress archive
  get_url:
    url: https://wordpress.org/latest.tar.gz
    dest: /tmp/wordpress.tar.gz
    force: yes

- name: Extract WordPress to /var/www/html
  unarchive:
    src: /tmp/wordpress.tar.gz
    dest: /var/www/html
    remote_src: yes
    owner: "{{ web_user }}"
    group: "{{ web_group }}"

- name: Ensure wp-config.php exists
  template:
    src: wp-config.php.j2
    dest: /var/www/html/wordpress/wp-config.php
    owner: "{{ web_user }}"
    group: "{{ web_group }}"
    mode: '0640'
  when: 
    - mysql_database is defined
    - mysql_user is defined
    - mysql_password is defined

- name: Set correct permissions for WordPress directory
  file:
    path: /var/www/html/wordpress
    owner: "{{ web_user }}"
    group: "{{ web_group }}"
    recurse: yes
