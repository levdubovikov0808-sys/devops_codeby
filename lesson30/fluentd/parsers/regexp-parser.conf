<parse>
  @type regexp
  expression /^(?<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d{3})\s+(?<level>\w+)\s+\[(?<thread>[^\]]+)\]\s+(?<class>[^:]+):\s+(?<method>[^\s]+)\s+-\s+(?<message>.*)$/
  time_key timestamp
  time_format %Y-%m-%d %H:%M:%S,%L
  types level:string,thread:string,class:string,method:string,message:string
</parse>
