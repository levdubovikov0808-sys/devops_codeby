<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter ui.service>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type regexp
    expression /^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?<level>\w+) \[(?<thread>[^\]]+)\] (?<class>[^:]+): (?<message>.*)$/
  </parse>
</filter>

<match **>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  flush_interval 1s
</match>
