replicaCount: 1

wordpress:
  image:
    repository: wordpress
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""  # use default if empty

mysql:
  image:
    repository: mysql
    tag: 8.0
    pullPolicy: IfNotPresent
  service:
    port: 3306
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  database: wordpress
  user: wordpress

secrets:
  mysqlRootPassword: ""
  mysqlPassword: ""
  wordpressPassword: ""

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: true
  className: nginx
  host: wordpress.local
  tls: []
