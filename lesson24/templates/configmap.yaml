apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-config
  labels:
    app: wordpress
    release: {{ .Release.Name }}
data:
  wp-config.php: |
    <?php
    define( 'DB_NAME', '{{ .Values.mysql.database }}' );
    define( 'DB_USER', '{{ .Values.mysql.user }}' );
    define( 'DB_PASSWORD', getenv('WORDPRESS_DB_PASSWORD') );
    define( 'DB_HOST', '{{ include "mysql.fullname" . }}' );
    define( 'DB_CHARSET', 'utf8' );
    define( 'DB_COLLATE', '' );
    $table_prefix = 'wp_';
    define( 'WP_DEBUG', false );
    if ( ! defined( 'ABSPATH' ) ) {
        define( 'ABSPATH', __DIR__ . '/' );
    }
    require_once ABSPATH . 'wp-settings.php';
