name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
    tags:
      - "v*"

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn test

      - name: Build jars
        run: mvn -DskipTests package

  docker:
    needs: test-build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/shareit-server:${{ github.sha }}
            ghcr.io/${{ github.repository }}/shareit-server:latest

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gateway.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/shareit-gateway:${{ github.sha }}
            ghcr.io/${{ github.repository }}/shareit-gateway:latest
