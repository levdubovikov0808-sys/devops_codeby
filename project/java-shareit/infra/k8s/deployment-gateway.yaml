apiVersion: apps/v1
kind: Deployment
metadata:
  name: shareit-gateway
  namespace: shareit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shareit-gateway
  template:
    metadata:
      labels:
        app: shareit-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/yourname/java-shareit-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shareit-config
            - secretRef:
                name: shareit-secret
