apiVersion: apps/v1
kind: Deployment
metadata:
  name: shareit-gateway
  namespace: shareit
spec:
  replicas: {{ .Values.replicaCount.gateway }}
  selector:
    matchLabels:
      app: shareit-gateway
  template:
    metadata:
      labels:
        app: shareit-gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.gateway.repository }}:{{ .Values.image.gateway.tag }}"
          ports:
            - containerPort: 8080
